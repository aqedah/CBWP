<style>
/* Layout: one working column — sticky header with tabs, then stacked "sheets" like pages on a music stand. */
:root{
  --bg:#eef1f4; --sheet:#ffffff; --ink:#18213a; --ink2:#4a5370; --muted:#7a8299;
  --line:#d7dce5; --soft:#f5f7fa; --accent:#2b3f8f; --accent-ink:#ffffff; --accent-soft:#e6eaf7;
  --danger:#b3261e; --ok:#1d7a4d; --warn:#9a6400;
  --v1:#ffe45c; --v2:#7fd3ff; --v3:#ff9fc9; --v4:#a8ee8c; --v5:#ffb86b; --v6:#c9a8ff;
  --font-display:"Gowun Batang","Nanum Myeongjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141f; --sheet:#181e2c; --ink:#e9ecf5; --ink2:#b5bcd0; --muted:#8a92a8;
  --line:#2c3447; --soft:#1e2536; --accent:#9fb1ff; --accent-ink:#10141f; --accent-soft:#252f4d;
  --danger:#ff8a80; --ok:#6fd3a0; --warn:#f2c46b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141f; --sheet:#181e2c; --ink:#e9ecf5; --ink2:#b5bcd0; --muted:#8a92a8;
  --line:#2c3447; --soft:#1e2536; --accent:#9fb1ff; --accent-ink:#10141f; --accent-soft:#252f4d;
  --danger:#ff8a80; --ok:#6fd3a0; --warn:#f2c46b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 6px;position:relative;padding-right:170px}
.brand .links{position:absolute;right:0;top:12px;height:42px;display:flex;align-items:center}
.brand h1{font-family:var(--font-display);font-size:1.45rem;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;min-height:42px}
.brand h1 small{font-family:var(--font-body);font-size:.78rem;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.homelink{display:inline-flex;align-items:center;gap:10px}.brandlogo{height:42px;width:auto;flex:none;display:block}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brandlogo,:root:not([data-theme="light"]) .bigLogo{filter:invert(1) brightness(1.6)}}:root[data-theme="dark"] .brandlogo,:root[data-theme="dark"] .bigLogo{filter:invert(1) brightness(1.6)}
.bigLogo{display:block;height:110px;width:auto;margin:18px auto 0}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.85rem;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--soft)}
.links a{height:34px;box-sizing:border-box}
.links a:hover{border-color:var(--accent);color:var(--ink)}
.links svg{width:16px;height:16px;flex:none}
@media (max-width:700px){.brand{padding-right:52px}.brandlogo{height:34px}.brand h1{font-size:1.25rem}.links a{padding:8px;border-radius:999px}.links a .ytlabel{display:none}.links svg{width:20px;height:20px}}
/* bottom nav (4 big groups) + sub-tabs */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .06);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:640px;margin:0 auto}
.bnav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:60px;border:0;background:none;color:var(--muted);font:inherit;font-size:.74rem;font-weight:700;cursor:pointer;position:relative}
.bnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--team,var(--accent))}
.bnav button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:currentColor}
body.has-bnav{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
body.has-bnav .totop{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
body.has-bnav .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px}
.subtabs button{flex:1 0 auto;border:0;background:none;padding:8px 14px;border-radius:9px;font:inherit;font-weight:700;font-size:.9rem;color:var(--ink2);cursor:pointer;white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .1)}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chipbar .fchip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--sheet);color:var(--ink2);font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.chipbar .fchip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chipbar select{height:34px;font-size:.84rem;width:auto;min-width:130px;padding:0 28px 0 10px;margin-left:auto}
.star{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer}
.star[aria-pressed="true"]{color:#d99a00;border-color:#e8c25a;background:color-mix(in srgb,#ffd34d 18%,var(--sheet))}

main{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sheet>h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet>h2 .sub{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:500}
.banner{border-radius:var(--r);padding:10px 14px;font-size:.9rem;border:1px solid var(--line);background:var(--soft);color:var(--ink2)}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner b{color:var(--ink)}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:.78rem;font-weight:600;color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:60px}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:var(--ink2)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 13px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hint{font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip button{border:0;background:none;padding:0 2px;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1}
.tier{font-size:.68rem;font-weight:700;border-radius:4px;padding:1px 5px;border:1px solid currentColor;line-height:1.3}
.tier.t정규,.tier.t정회원{color:var(--accent)} .tier.t수습,.tier.t준회원{color:var(--ok)} .tier.t게스트{color:var(--warn)} .tier.t임시{color:var(--ink2);border-style:dashed} .tier.t휴면{color:var(--muted);border-style:dotted} .tier.t직접입력{color:var(--ink2)}

/* savebar */
.savebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.82rem;color:var(--muted)}
.status.dirty{color:var(--warn)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--soft)}
.slot-head{display:flex;align-items:center;gap:6px}
.slot-head strong{font-size:.88rem}
.slot-people{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.slot .add{align-self:flex-start}
.slot-x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}

/* setlist */
.setlist{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--sheet)}
.prow.dragging{box-shadow:0 10px 28px rgb(0 0 0 / .18);border-color:var(--accent)!important;background:var(--sheet);position:relative;z-index:5}
.item.dragging{box-shadow:0 10px 28px rgb(0 0 0 / .18);border-color:var(--accent);position:relative;z-index:5}
.item .lead{display:flex;flex-direction:column;align-items:center;gap:2px}
.handle{border:0;background:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px 6px;cursor:grab;touch-action:none;border-radius:6px}
.handle:hover{background:var(--soft);color:var(--ink)}
.item.dragging .handle{cursor:grabbing}
.item .no{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.6;font-variant-numeric:tabular-nums}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .title{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item input.key{width:74px}
.scoreinfo{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px 3px 4px;cursor:pointer;text-align:left;min-width:0;max-width:100%}
.scoreinfo.none{border-style:dashed;border-color:var(--line);background:var(--soft);padding-left:10px}
.scoreinfo span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.scoreinfo small{font-size:.7rem;color:var(--muted)}
.scoreinfo b{font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sthumb{width:30px;height:38px;flex:none;border-radius:4px;background:#fff center/cover no-repeat;border:1px solid var(--line)}
.vpick{display:flex;flex-direction:column;gap:8px}
.hymngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px}
.hymn{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:5px 8px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.hymn b{font-variant-numeric:tabular-nums;color:var(--muted);min-width:30px;font-size:.8rem}
.hymn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.88rem}
.hymn.in{background:var(--accent-soft);border-color:var(--accent)}.hymn.in b{color:var(--accent)}
details>summary.sumh{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);font-size:1.15rem;font-weight:700}
details>summary.sumh::-webkit-details-marker{display:none}
details>summary.sumh::before{content:"▸";font-family:var(--font-body);font-size:.9rem;color:var(--team,var(--accent))}
details[open]>summary.sumh::before{content:"▾"}
details>summary.sumh .sub{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:500}
a.btn.disabled{opacity:.55;pointer-events:auto;cursor:default}
.cithumb{width:46px;height:60px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:4px;background:#fff;flex:none}
.byl{display:flex;flex-direction:column;gap:14px;max-width:76ch}
.bylpage{border-top:1px solid var(--line);padding-top:10px}
.bylno{font-size:.75rem;font-weight:700;color:var(--team,var(--accent));margin-bottom:4px}
.byltext{white-space:pre-wrap;line-height:1.8;word-break:keep-all}
.bylhit{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);line-height:1.7;word-break:keep-all}
.bylhit mark,.byl mark{background:#ffe45c;color:#18213a;border-radius:2px}
.totop{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:31;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);color:var(--ink);box-shadow:0 6px 18px rgb(0 0 0 / .15);font-size:1.2rem;cursor:pointer;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.totop.on{opacity:1;pointer-events:auto;transform:none}
body.fb-pad .totop{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.cal-day.hol .dn{color:var(--danger)}
.holname{display:block;font-size:.66rem;color:var(--danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.pastdet{background:var(--accent-soft);border-color:color-mix(in srgb,var(--team,var(--accent)) 45%,var(--line))}
details.pastdet>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--font-display);font-size:1.15rem;font-weight:700}
details.pastdet>summary::before{content:"▸";font-family:var(--font-body);font-size:.9rem;color:var(--team,var(--accent));transition:transform .15s}
details.pastdet[open]>summary::before{transform:rotate(90deg)}
details.pastdet>summary .sub{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:500}
details.pastdet>summary::-webkit-details-marker{display:none}
details.pastdet>summary .sub{margin-left:auto}
details.pastdet[open]>summary{margin-bottom:12px}
.floatbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgb(0 0 0 / .08);padding-block:8px calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .2s}
.floatbar.on{transform:none}
.fb-in{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fb-in .status{font-size:.8rem}
body.fb-pad{padding-bottom:72px}
@media (max-width:520px){.fb-in .status{display:none}.fb-in .spacer{display:none}.fb-in{justify-content:flex-end}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.cal-wd{text-align:center;font-size:.78rem;font-weight:700;color:var(--muted);padding:4px 0}
.cal-wd.sun{color:var(--danger)}.cal-wd.sat{color:var(--accent)}
.cal-day{display:flex;flex-direction:column;align-items:stretch;gap:2px;min-height:86px;min-width:0;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);text-align:left;cursor:pointer;overflow:hidden}
.cal-day.out{opacity:.45}
.cal-day.today .dn{background:var(--team,var(--accent));color:#fff;border-radius:999px;padding:0 6px}
.cal-day.sel{border:2px solid var(--team,var(--accent))}
.cal-day.sun .dn{color:var(--danger)}.cal-day.today.sun .dn{color:#fff}
.cal-day .dn{align-self:flex-start;font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums}
.cal-day .more{font-size:.7rem;color:var(--muted)}
.chipc{display:block;font-size:.7rem;line-height:1.35;border-radius:4px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--kc);background:color-mix(in srgb,var(--kc) 14%,transparent);color:var(--ink)}
.k-service{--kc:var(--team,var(--accent))}.chipc.span{border-radius:0;margin-inline:-5px}.chipc.span.s0{border-radius:4px 0 0 4px;margin-left:0}.chipc.span.s2{border-radius:0 4px 4px 0;margin-right:0}.chipc.span.s1,.chipc.span.s2{border-left-color:transparent}
.k-practice{--kc:#d9822b}.k-group{--kc:#1d8a5a}.k-etc,.k-custom{--kc:#7a8299}.k-bday{--kc:#d6457a}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.cal-legend .chipc{display:inline-block;font-size:.75rem}
.evcard{text-align:left;border-left:4px solid var(--kc);cursor:pointer;font:inherit;color:inherit}
.uplist{display:flex;flex-direction:column;gap:8px}
.uprow{display:grid;grid-template-columns:150px auto 1fr;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--kc,var(--line));border-radius:10px;background:var(--sheet);text-align:left;cursor:pointer;font:inherit;color:inherit}
.uprow .chipc{display:inline-block}
@media (max-width:520px){.cal-day{min-height:62px;padding:3px}.cal-day .chipc{font-size:.62rem;padding:0 2px}.uprow{grid-template-columns:1fr auto}.uprow>span:last-child{grid-column:1/-1}}
.vedit{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px 4px}
.ytnote{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:.85rem;color:var(--ink2)}
.vcard{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:6px}
.vcard.on{border:2px solid var(--accent);background:var(--accent-soft)}
.vmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:4px}
.vthumb{width:64px;height:84px;flex:none;border-radius:6px;background:#fff center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.vtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.vtext small{color:var(--muted)}
.vtext em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
.titlerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

async function storeImage(im){const id=uid(12);imgCache.set(id,im.url);

  for(let i=0;i<n;i++)await S.db.doc(`imgChunks/${id}.${i}`).set({d:im.url.slice(i*CHUNK,(i+1)*CHUNK)});
  await S.db.doc(`imgs/${id}`).set({n,w:im.w,h:im.h,by:S.myId||null,at:Date.now()});
  return id;}
function getImg(id){if(imgCache.has(id))return Promise.resolve(imgCache.get(id));if(imgInflight.has(id))return imgInflight.get(id);
  const p=(async()=>{if(!S.db)return null;const meta=await S.db.doc(`imgs/${id}`).get();if(!meta.exists)return null;const n=meta.data().n;
    const parts=await Promise.all(Array.from({length:n},(_,i)=>S.db.doc(`imgChunks/${id}.${i}`).get()));
    const url=parts.map(p=>p.exists?p.data().d:"").join("");imgCache.set(id,url);return url;})()
    .catch(()=>null).finally(()=>imgInflight.delete(id));

function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
function toJpeg(src,w,h){const max=1700,s=Math.min(1,max/w);const cw=Math.round(w*s),ch=Math.round(h*s);
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
  let q=.85,url=c.toDataURL("image/jpeg",q);while(url.length>900000&&q>.5){q-=.1;url=c.toDataURL("image/jpeg",q);}return{url,w:cw,h:ch};}
async function fileToImages(file){const name=(file.name||"").toLowerCase(),type=file.type||"";
  if(type==="application/pdf"||name.endsWith(".pdf")){
    await loadScript(PDFJS_URL);await loadScript(PDFJS_WORKER);
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];
    for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const v0=page.getViewport({scale:1});const vp=page.getViewport({scale:1700/v0.width});
      const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
      await page.render({canvasContext:x,viewport:vp}).promise;out.push(toJpeg(c,c.width,c.height));}
    return out;}
  if(/\.(heic|heif)$/.test(name)||/hei[cf]/.test(type)){
    try{const bmp=await createImageBitmap(file);return[toJpeg(bmp,bmp.width,bmp.height)];}catch(e){}
    await loadScript(HEIC_URL);let out=await window.heic2any({blob:file,toType:"image/jpeg",quality:.9});out=Array.isArray(out)?out[0]:out;
    const u=URL.createObjectURL(out);try{const i=await loadImg(u);return[toJpeg(i,i.naturalWidth,i.naturalHeight)];}finally{URL.revokeObjectURL(u);}}

  catch(e){try{const bmp=await createImageBitmap(file);return[toJpeg(bmp,bmp.width,bmp.height)];}catch(e2){throw new Error(`${file.name}: 이 형식은 열 수 없어요`);}}
  finally{URL.revokeObjectURL(u);}}

/* a title row is "제목\t첫 줄…" (a string, since Firestore can't keep arrays inside arrays); older rows were arrays */
function catItems(cat){return(cat.items||[]).map(r=>typeof r==="string"?r.split("\t"):(typeof r[0]==="number"||r[0]===null?r.slice(1):r)).filter(r=>r&&r[0]);}
/* fast search: catalogs are parsed and normalised once, then every keystroke only compares ready-made strings */
const SIDX={cats:null,len:-1,list:[],dup:{}};

  const list=[],dup={};for(const cat of S.catalogs)for(const[title,...alts]of catItems(cat)){const nt=norm(title);dup[nt]=(dup[nt]||0)+1;
    list.push({title,alts,nt,ct:choStr(nt),na:alts.map(norm),ca:alts.map(a=>choStr(norm(a))),hymn:splitTitle(title).hymn});}
  SIDX.cats=S.catalogs;SIDX.len=S.catalogs.length;SIDX.list=list;SIDX.dup=dup;return SIDX;}
function prepQ(q){const qq=norm(q);const qc=[...qq];return{qq,qc,allCons:qc.length>0&&qc.every(isCons),anyCons:qc.some(isCons)};}
function rankN(nt,ct,Q){if(!Q.qq)return -1;const i=nt.indexOf(Q.qq);if(i===0)return 0;if(i>0)return 1;if(!Q.anyCons)return -1;
  if(Q.allCons){const j=ct.indexOf(Q.qq);return j<0?-1:j===0?2:3;}
  const tc=[...nt],cc=[...ct],qc=Q.qc;for(let s=0;s+qc.length<=tc.length;s++){let ok=true;for(let j=0;j<qc.length;j++){const a=qc[j];if(a===tc[s+j]||(isCons(a)&&cc[s+j]===a))continue;ok=false;break;}if(ok)return s===0?2:3;}return -1;}
function suggest(q,yid){const out=[];q=(q||"").trim();const num=/^\d+$/.test(q)?+q:null;const Q=prepQ(q);

/* 압축버전: 모든 악보를 A3 한 장에 */
function drawMarks(x,p,dx,dy,dw,dh){x.save();x.globalCompositeOperation="multiply";x.globalAlpha=.55;for(const mk of p.marks||[])if(mk.k==="H"){x.fillStyle=VCOL[(mk.v||1)-1];x.fillRect(dx+mk.x*dw,dy+mk.y*dh,mk.w*dw,mk.h*dh);}x.restore();
  const fs=Math.max(9,dw*.023);x.font=`700 ${fs}px ${FB}`;x.textBaseline="top";
  for(const mk of p.marks||[])if(mk.k==="L"){const tw=x.measureText(mk.t).width;const bx=dx+mk.x*dw,by=dy+mk.y*dh;x.fillStyle="#18213a";rr(x,bx,by,tw+fs*.9,fs*1.5,fs*.3);x.fill();x.fillStyle="#fff";x.fillText(mk.t,bx+fs*.45,by+fs*.22);}
  x.textBaseline="alphabetic";}
async function exportCompact(c){if(!c)return;
  const secs=SECTIONS.map(([k,l])=>[l,c[k]||[]]);
  const items=[];let no=0;for(const[l,arr]of secs)for(const it of arr){no++;(it.pages||[]).forEach((p,pi)=>items.push({it,no,p,pi,pn:it.pages.length,sec:l}));}
  if(!items.length)return toast("이 콘티에는 악보가 없어요. 곡마다 악보를 먼저 골라 주세요.");
  const md=modal("압축버전 만드는 중",h("div",{class:"panel-body"},h("p",{id:"pdf-st",text:"악보를 모으고 있어요…"})),null);const st=$("#pdf-st",md.el);
  try{await loadScript(JSPDF_URL);try{await document.fonts.load(`700 40px "Gowun Batang"`);await document.fonts.load(`600 20px "IBM Plex Sans KR"`);}catch(e){}
    const imgs=[];for(const s of items){st.textContent=`악보 불러오는 중… (${imgs.length+1}/${items.length})`;const u=await getImg(s.p.imgId);imgs.push(u?await loadImg(u):null);}
    const W=3307,H=2339,M=50,HEAD=150,CAP=34,GAP=18;   /* A3 landscape only */
    const ratio=imgs.map((im,i)=>im?im.naturalWidth/im.naturalHeight:(items[i].p.w||1)/(items[i].p.h||1.414));
    /* best grid for a set of scores on one page */
    const lay=(idx,head)=>{const aw=W-2*M,ah=H-2*M-head;let best=null;
      for(let cols=1;cols<=idx.length;cols++){const rows=Math.ceil(idx.length/cols);const cw=(aw-GAP*(cols-1))/cols,ch=(ah-GAP*(rows-1))/rows-CAP;if(ch<=20)continue;
        let sc=Infinity,mh=Infinity;for(const i of idx){const r=ratio[i];const w=Math.min(cw,ch*r);sc=Math.min(sc,w*w/r);mh=Math.min(mh,w/r);}
        if(!best||sc>best.sc)best={sc,mh,cols,cw,ch,idx,head};}return best;};
    const all=items.map((_,i)=>i);let pages=[lay(all,HEAD)];
    /* doesn't fit legibly on one sheet → use the back side too (2 pages at most) */
    if(items.length>1&&pages[0].mh<900){const cand=[];for(let k=1;k<items.length;k++){const p1=lay(all.slice(0,k),HEAD),p2=lay(all.slice(k),40);if(p1&&p2)cand.push({k,sc:Math.min(p1.sc,p2.sc),pp:[p1,p2]});}
      /* among nearly-as-good splits, keep the two sides even */
      const top=Math.max(...cand.map(x=>x.sc));const b2=cand.filter(x=>x.sc>=top*.85).sort((a,b)=>Math.abs(a.k-items.length/2)-Math.abs(b.k-items.length/2))[0];
      if(b2&&b2.sc>pages[0].sc*1.15)pages=b2.pp;}
    const cvs=pages.map((pg,pn)=>{const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
      x.fillStyle="#fff";x.fillRect(0,0,W,H);x.textBaseline="alphabetic";
      if(pn===0){x.fillStyle="#2b3f8f";x.fillRect(M,M,8,64);
        x.fillStyle="#18213a";const t=`${fmtDate(c.date)}  ${wtypeOf(c)}${c.sermonTitle?"  ·  "+c.sermonTitle:""}`;fitText(x,t,W-2*M-30,44,"700",FD);x.fillText(ellipsize(x,t,W-2*M-30),M+26,M+46);
        const info=[c.passage&&`본문 ${c.passage}`,c.preacher&&`설교 ${c.preacher}`,leaderOf(c)&&`인도 ${leaderOf(c)}`].filter(Boolean).join("   ");
        const order=secs.filter(([,a])=>a.length).map(([l,a])=>`${l}: `+a.map(it=>it.title+(it.key?`(${it.key})`:"")).join(" → ")).join("   |   ");
        x.font=`500 24px ${FB}`;x.fillStyle="#4a5370";x.fillText(ellipsize(x,info,W-2*M-30),M+26,M+90);
        x.font=`600 22px ${FB}`;x.fillStyle="#18213a";x.fillText(ellipsize(x,order,W-2*M),M,M+128);
        x.strokeStyle="#18213a";x.lineWidth=2;x.beginPath();x.moveTo(M,M+HEAD-6);x.lineTo(W-M,M+HEAD-6);x.stroke();}
      const{cols,cw,ch,idx,head}=pg;
      const rowH=[];idx.forEach((i,j)=>{const r=Math.floor(j/cols);rowH[r]=Math.max(rowH[r]||0,Math.min(ch,cw/ratio[i]));});
      const rowY=[];rowH.reduce((y,hh,r)=>(rowY[r]=y,y+hh+CAP+GAP),M+head);
      idx.forEach((i,j)=>{const s=items[i];const r=Math.floor(j/cols),k=j%cols;const cx=M+k*(cw+GAP),cy=rowY[r];
        x.fillStyle="#2b3f8f";x.font=`700 22px ${FB}`;const lab=`${s.no}. `;x.fillText(lab,cx,cy+24);const lw=x.measureText(lab).width;
        const right=[s.it.key?`Key ${s.it.key}`:"",s.pn>1?`${s.pi+1}/${s.pn}`:""].filter(Boolean).join(" ");x.font=`600 18px ${FB}`;const rw=x.measureText(right).width;x.fillStyle="#4a5370";x.fillText(right,cx+cw-rw,cy+24);
        x.fillStyle="#18213a";x.font=`700 22px ${FB}`;x.fillText(ellipsize(x,s.it.title,cw-lw-rw-12),cx+lw,cy+24);
        const im=imgs[i];const top=cy+CAP;
        if(im){const sc=Math.min(cw/im.naturalWidth,ch/im.naturalHeight);const dw=im.naturalWidth*sc,dh=im.naturalHeight*sc;const dx=cx+(cw-dw)/2;
          x.drawImage(im,dx,top,dw,dh);x.strokeStyle="#d7dce5";x.lineWidth=1;x.strokeRect(dx,top,dw,dh);drawMarks(x,s.p,dx,top,dw,dh);}
        else{x.fillStyle="#7a8299";x.font=`400 18px ${FB}`;x.fillText("악보를 불러오지 못했어요",cx,top+30);}});
      x.fillStyle="#7a8299";x.font=`400 16px ${FB}`;x.fillText(`Central Bible Worship Planner · ${teamName(teamOf(c))} · 압축버전 (A3)${pages.length>1?`  ·  ${pn+1} / ${pages.length}`:""}`,M,H-18);
      return cv;});
    st.textContent="PDF로 묶는 중…";
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a3",orientation:"landscape",compress:true});
    cvs.forEach((cv,i)=>{if(i)doc.addPage("a3","landscape");doc.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,420,297,undefined,"FAST");});
    const blob=doc.output("blob");const fname=`${teamName(teamOf(c))}_콘티_${c.date||"날짜미정"}_압축A3.pdf`;md.close();
    if(S.downloads){try{await S.downloads.save({filename:fname,data:blob});toast(cvs.length>1?"압축버전 PDF를 저장했어요 (2쪽 · 양면으로 뽑으세요)":"압축버전 PDF를 저장했어요");}
      catch(e){if(e&&e.code==="declined")toast("저장을 취소했어요");else showPreview(cvs);}}
    else showPreview(cvs);
  }catch(e){md.close();toast("압축버전을 만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.");console.error(e);}}
function showPreview(canvases){const body=h("div",{class:"panel-body pdfprev"},h("p",{class:"hint",text:"이 화면에서는 파일 저장이 안 돼요. 아래 이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요."}),canvases.map(cv=>h("img",{src:cv.toDataURL("image/jpeg",.85),alt:"콘티 페이지"})));
  modal("출력 미리보기",body,null);}

   BOOT

if(!S.team||!loadDraft())S.cur=blankConti();
/* stand-alone listeners: shared data (songs, title lists) and one team's data */
const RR={rerender:()=>render(),onErr:e=>console.warn(e),shared:false,team:null,offs:[]};
function startShared(){if(RR.shared||!S.db)return;RR.shared=true;const db=S.db;
  db.collection("catalog").onSnapshot(s=>{S.catalogs=s.docs.map(d=>({id:d.id,...clone(d.data())}));RR.rerender();},RR.onErr);
  db.collection("songs").onSnapshot(s=>{S.songs=s.docs.map(d=>({id:d.id,...clone(d.data())}));RR.rerender();},RR.onErr);}
function startTeam(team){if(!S.db||RR.team===team)return;RR.offs.forEach(f=>f());RR.offs=[];RR.team=team;const db=S.db;S.allContis=[];S.allMembers=[];S.allEvents=[];S.teamCfgs={};
  RR.offs.push(db.collection("contis").where("team","==",team).onSnapshot(s=>{S.allContis=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();RR.rerender();},RR.onErr));
  RR.offs.push(db.collection("members").where("team","==",team).onSnapshot(s=>{S.allMembers=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();RR.rerender();},RR.onErr));
  RR.offs.push(db.collection("events").where("team","==",team).onSnapshot(s=>{S.allEvents=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();if(["cal","home","me","members","attend","lineup"].includes(S.tab))RR.rerender();},RR.onErr));
  RR.offs.push(db.doc(`teams/${team}`).onSnapshot(d=>{S.teamCfgs=d.exists?{[team]:clone(d.data())}:{};if(S.tab!=="write")RR.rerender();},RR.onErr));}
render();
(async()=>{
  const claude=window.claude;
  const [db,user,downloads]=claude?await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads")]):[null,null,null];
  S.db=db;S.user=user;S.downloads=downloads;
  if(user){S.myId=await user.id();S.isOwner=await user.isOwner();const cw=await user.can("data.write");S.canWrite=cw!==false;}
  if(window.CBWP)S.canWrite=!!S.team&&window.CBWP.canWrite(S.team);
  if(!db){S.dbFailed=true;S.ready=true;render();return;}
  let got=0;const done=()=>{if(++got===6){S.ready=true;render();}};
  const onErr=e=>{console.warn(e);if(e&&e.code!=="unavailable"){S.dbFailed=true;S.ready=true;render();}};
  const rerender=()=>{if(!S.ready)return;if(!S.team){render();return;}if(S.tab==="write")return;
    if((S.tab==="cal"||S.tab==="home")&&document.querySelector(".modal"))return;
    if(S.tab==="home"){const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return;}
    if(S.tab==="past"||S.tab==="list"){const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))&&!document.querySelector(".modal"))render();return;}
    if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)&&document.activeElement.closest("#main")&&S.tab!=="list"&&S.tab!=="stats"){const fn=({songs:renderSongs,members:renderMembers})[S.tab];fn&&fn.redraw&&fn.redraw();return;}
    render();};
  RR.rerender=rerender;RR.onErr=onErr;
  if(window.CBWP){/* stand-alone: nothing is readable until a team password was entered on this device */
    if(S.team&&!window.CBWP.canWrite(S.team))S.team=null;
    S.ready=true;if(S.team){startShared();startTeam(S.team);}render();return;}
  let f1=0,f2=0,f3=0,f4=0,f5=0,f6=0;
  db.collection("events").onSnapshot(s=>{S.allEvents=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();if(!f6++)done();else if(["cal","home","me","members","attend","lineup"].includes(S.tab))rerender();},onErr);
  db.collection("teams").onSnapshot(s=>{S.teamCfgs=Object.fromEntries(s.docs.map(d=>[d.id,clone(d.data())]));if(!f5++)done();else if(S.tab!=="write")rerender();},onErr);
  db.collection("catalog").onSnapshot(s=>{S.catalogs=s.docs.map(d=>({id:d.id,...clone(d.data())}));if(!f4++)done();else rerender();},onErr);
  db.collection("members").onSnapshot(s=>{S.allMembers=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();if(!f1++)done();else rerender();},onErr);

  db.collection("contis").onSnapshot(s=>{S.allContis=s.docs.map(d=>({id:d.id,...clone(d.data())}));applyTeam();if(!f3++)done();else rerender();},onErr);
})().catch(e=>{console.error(e);S.dbFailed=true;S.ready=true;render();});
setTimeout(()=>{try{const t=sessionStorage.getItem("cbwp-toast");if(t){sessionStorage.removeItem("cbwp-toast");toast(t);}}catch(e){}},1500);
