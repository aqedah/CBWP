<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="중앙성서교회 찬양팀 콘티 · 악보 · 결산">
<meta name="theme-color" content="#2b3f8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CB 워십">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="platform.js"></script>
<title>Central Bible Worship Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column — sticky header with tabs, then stacked "sheets" like pages on a music stand. */
:root{
  --bg:#eef1f4; --sheet:#ffffff; --ink:#18213a; --ink2:#4a5370; --muted:#7a8299;
  --line:#d7dce5; --soft:#f5f7fa; --accent:#2b3f8f; --accent-ink:#ffffff; --accent-soft:#e6eaf7;
  --danger:#b3261e; --ok:#1d7a4d; --warn:#9a6400;
  --v1:#ffe45c; --v2:#7fd3ff; --v3:#ff9fc9; --v4:#a8ee8c; --v5:#ffb86b; --v6:#c9a8ff;
  --font-display:"Gowun Batang","Nanum Myeongjo",serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141f; --sheet:#181e2c; --ink:#e9ecf5; --ink2:#b5bcd0; --muted:#8a92a8;
  --line:#2c3447; --soft:#1e2536; --accent:#9fb1ff; --accent-ink:#10141f; --accent-soft:#252f4d;
  --danger:#ff8a80; --ok:#6fd3a0; --warn:#f2c46b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10141f; --sheet:#181e2c; --ink:#e9ecf5; --ink2:#b5bcd0; --muted:#8a92a8;
  --line:#2c3447; --soft:#1e2536; --accent:#9fb1ff; --accent-ink:#10141f; --accent-soft:#252f4d;
  --danger:#ff8a80; --ok:#6fd3a0; --warn:#f2c46b; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:12px 6px}
.brand h1{font-family:var(--font-display);font-size:1.45rem;margin:0;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px}
.brand h1 small{font-family:var(--font-body);font-size:.78rem;color:var(--muted);font-weight:500}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:.85rem;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--soft)}
.links a:hover{border-color:var(--accent);color:var(--ink)}
.links svg{width:16px;height:16px;flex:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.sheet>h2{font-family:var(--font-display);font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sheet>h2 .sub{font-family:var(--font-body);font-size:.8rem;color:var(--muted);font-weight:500}
.banner{border-radius:var(--r);padding:10px 14px;font-size:.9rem;border:1px solid var(--line);background:var(--soft);color:var(--ink2)}
.banner.warn{border-color:var(--warn);color:var(--warn)}
.banner b{color:var(--ink)}

/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lab{font-size:.78rem;font-weight:600;color:var(--ink2);letter-spacing:.02em}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:9px 11px;min-width:0}
textarea{resize:vertical;min-height:60px}
input:disabled,select:disabled,textarea:disabled{background:var(--soft);color:var(--ink2)}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:8px 13px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hint{font-size:.8rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.82rem;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip button{border:0;background:none;padding:0 2px;cursor:pointer;color:var(--muted);font-size:1rem;line-height:1}
.tier{font-size:.68rem;font-weight:700;border-radius:4px;padding:1px 5px;border:1px solid currentColor;line-height:1.3}
.tier.t정규{color:var(--accent)} .tier.t수습{color:var(--ok)} .tier.t게스트{color:var(--warn)} .tier.t임시{color:var(--ink2);border-style:dashed}

/* savebar */
.savebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.82rem;color:var(--muted)}
.status.dirty{color:var(--warn)}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--soft)}
.slot-head{display:flex;align-items:center;gap:6px}
.slot-head strong{font-size:.88rem}
.slot-people{display:flex;flex-wrap:wrap;gap:4px;min-height:24px}
.slot .add{align-self:flex-start}
.slot-x{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;font-size:1rem}

/* setlist */
.setlist{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--sheet)}
.item.dragging{box-shadow:0 10px 28px rgb(0 0 0 / .18);border-color:var(--accent);position:relative;z-index:5}
.item .lead{display:flex;flex-direction:column;align-items:center;gap:2px}
.handle{border:0;background:none;color:var(--muted);font-size:1.25rem;line-height:1;padding:4px 6px;cursor:grab;touch-action:none;border-radius:6px}
.handle:hover{background:var(--soft);color:var(--ink)}
.item.dragging .handle{cursor:grabbing}
.item .no{font-family:var(--font-display);font-size:1.3rem;font-weight:700;color:var(--accent);text-align:center;line-height:1.6;font-variant-numeric:tabular-nums}
.item .body{display:flex;flex-direction:column;gap:6px;min-width:0}
.item .title{font-weight:700;font-size:1rem;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item input.key{width:74px}
.scoreinfo{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 10px 3px 4px;cursor:pointer;text-align:left;min-width:0;max-width:100%}
.scoreinfo.none{border-style:dashed;border-color:var(--line);background:var(--soft);padding-left:10px}
.scoreinfo span{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.scoreinfo small{font-size:.7rem;color:var(--muted)}
.scoreinfo b{font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sthumb{width:30px;height:38px;flex:none;border-radius:4px;background:#fff center/cover no-repeat;border:1px solid var(--line)}
.vpick{display:flex;flex-direction:column;gap:8px}
.vedit{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 6px 4px}
.ytnote{display:flex;flex-direction:column;gap:6px;margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--accent-soft);font-size:.85rem;color:var(--ink2)}
.vcard{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:6px}
.vcard.on{border:2px solid var(--accent);background:var(--accent-soft)}
.vmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;text-align:left;cursor:pointer;padding:4px}
.vthumb{width:64px;height:84px;flex:none;border-radius:6px;background:#fff center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:.75rem}
.vtext{display:flex;flex-direction:column;gap:2px;min-width:0}
.vtext small{color:var(--muted)}
.vtext em{font-style:normal;font-size:.8rem;font-weight:700;color:var(--accent)}
.titlerow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.titlerow .ititle{flex:2 1 200px;min-width:0;font-weight:700;font-size:1rem}
.titlerow .iyt{flex:1 1 200px;min-width:0;font-size:.85rem}
.card.blankweek{background:var(--soft);border-style:dashed}
.rbtn{display:inline-flex;gap:6px;align-items:baseline;max-width:100%;min-width:0}
.rbtn span{font-weight:400;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.vers{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:8px}
.verrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.item select.versel{width:auto;max-width:100%;min-width:0;flex:0 1 auto}
.setlist.droptarget{outline:2px dashed var(--accent);outline-offset:4px;border-radius:8px}
.item input.memo{flex:1;min-width:160px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:.88rem}

/* search */
.search{position:relative}
.search .pending{margin-top:6px}
.suggest{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .14);z-index:15;max-height:320px;overflow:auto}
.suggest button{display:flex;width:100%;text-align:left;border:0;background:none;padding:9px 12px;gap:8px;align-items:center;cursor:pointer}
.suggest button[aria-selected="true"],.suggest button:hover{background:var(--accent-soft)}
.suggest .k{margin-left:auto;font-size:.78rem;color:var(--muted)}
.suggest .new{border-top:1px solid var(--line);color:var(--accent);font-weight:600}
.suggest a.ss{display:block;padding:8px 12px;font-size:.82rem;color:var(--ink2);border-top:1px dashed var(--line);text-decoration:none}
.suggest a.ss:hover{background:var(--soft)}

/* list cards */
.cards{display:flex;flex-direction:column;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--sheet)}
.card .when{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3{margin:0;font-family:var(--font-display);font-size:1.05rem}
.card .songs{font-size:.86rem;color:var(--ink2)}
.tag{font-size:.74rem;font-weight:600;border-radius:4px;padding:1px 7px;background:var(--soft);border:1px solid var(--line);color:var(--ink2)}

/* stats */
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(80px,180px) 1fr 44px;align-items:center;gap:10px;font-size:.86rem}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{height:14px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:0 4px 4px 0;min-width:3px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-family:var(--font-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
table.t{width:100%;border-collapse:collapse;font-size:.86rem}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left}
table.t td.n{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgb(10 14 24 / .55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.modal .panel{background:var(--sheet);width:min(720px,100%);max-height:92%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:720px){.modal{align-items:center}.modal .panel{border-radius:14px}}
.panel-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.panel-head h3{margin:0;font-family:var(--font-display);font-size:1.1rem;flex:1;min-width:0;overflow-wrap:anywhere}
.panel-body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.panel-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.pick input{width:18px;height:18px}
.pick .pos{margin-left:auto;font-size:.76rem;color:var(--muted);text-align:right}
.picklist{display:flex;flex-direction:column;gap:6px}

/* score editor */
.editor .panel{width:min(1100px,100%);height:100%;max-height:100%;border-radius:0}
@media (min-width:720px){.editor .panel{height:94%;border-radius:14px}}
.tools{display:flex;flex-direction:column;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft)}
.toolrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.seg button{border:0;background:none;padding:7px 11px;font-weight:600;font-size:.84rem;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.vbtn{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-weight:700;font-size:.82rem;cursor:pointer;color:#18213a}
.vbtn[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.lbtn{border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:5px 9px;font-weight:700;font-size:.8rem;cursor:pointer}
.lbtn[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.stagewrap{flex:1;overflow:auto;padding:16px;background:var(--bg)}
.stage{position:relative;margin:0 auto;max-width:860px;background:#fff;container-type:inline-size;user-select:none;-webkit-user-select:none;box-shadow:0 2px 14px rgb(0 0 0 / .12)}
.stage img{display:block;width:100%;height:auto;pointer-events:none}
.stage.draw{touch-action:none;cursor:crosshair}
.stage .loading{aspect-ratio:1/1.4;display:grid;place-items:center;color:#7a8299}
.mk{position:absolute}
.mk.hl{mix-blend-mode:multiply;opacity:.55;border-radius:2px}
.mk.lb{background:#18213a;color:#fff;font-weight:700;font-size:2.3cqw;line-height:1.15;padding:.18em .45em;border-radius:.3em;white-space:nowrap;font-family:var(--font-body)}
.stage.erase .mk{cursor:pointer}
.stage.erase .mk:hover{outline:2px dashed #b3261e}
.stage.move .mk,.stage.label .mk.lb{cursor:grab;touch-action:none}
.stage.label .mk.lb:hover{outline:2px solid var(--accent);outline-offset:1px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-top:1px solid var(--line);align-items:center}
.thumb{flex:none;width:56px;height:74px;border:2px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:#fff;display:grid;place-items:center;font-size:.7rem;color:#7a8299;padding:0}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:999px;font-size:.88rem;z-index:80;max-width:calc(100% - 32px);text-align:center}
footer.foot{padding-block:24px 36px;color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border-top:1px solid var(--line)}
footer.foot a{color:var(--ink2)}
.pdfprev img{width:100%;border:1px solid var(--line)}
@media (max-width:520px){.bar{grid-template-columns:90px 1fr 36px}}
.books{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bookcard{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft)}
.bookcard b{font-family:var(--font-display);font-size:1.05rem;display:block}
.bookcard span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.verse{margin:28px auto 22px;max-width:640px;text-align:center;padding-inline:8px}
.verse blockquote{margin:0;font-family:var(--font-display);font-size:clamp(1.3rem,4.2vw,1.85rem);line-height:1.5;color:var(--ink);text-wrap:balance;letter-spacing:-.01em;word-break:keep-all}
.verse blockquote::before{content:"";display:block;width:36px;height:3px;background:var(--accent);margin:0 auto 16px;border-radius:2px}
.verse figcaption{margin-top:10px;font-size:.85rem;color:var(--muted);letter-spacing:.08em}
.footverse{word-break:keep-all;font-family:var(--font-display);color:var(--ink2);font-size:.95rem}
.footverse span{font-family:var(--font-body);font-size:.78rem;color:var(--muted);margin-left:4px}
.teampick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:6px}
.teambtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;cursor:pointer;border:1px solid var(--line);border-top:5px solid var(--tc);border-radius:12px;background:var(--sheet);padding:18px 18px 16px;min-height:150px;transition:transform .15s,box-shadow .15s}
.teambtn:hover,.teambtn:focus-visible{transform:translateY(-2px);box-shadow:0 8px 22px rgb(0 0 0 / .08);border-color:var(--tc)}
.teambtn .tno{position:absolute;top:14px;right:16px;font-size:.78rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.teambtn .tnote{font-size:1.4rem;line-height:1;color:var(--tc);margin-bottom:8px}
.teambtn b{font-family:var(--font-display);font-size:1.5rem;color:var(--ink)}
.teambtn small{font-size:.7rem;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.teambtn>span:last-child{font-size:.82rem;color:var(--ink2);margin-top:6px}
.teamchip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-body);font-size:.8rem;font-weight:600;color:#fff;background:var(--team,var(--accent));border-radius:999px;padding:2px 10px}
.teamchip button{color:#fff!important;opacity:.85}
.lockchip{font-family:var(--font-body);font-size:.74rem;font-weight:600;border:1px solid var(--line);background:var(--soft);color:var(--ink2);border-radius:999px;padding:2px 10px;cursor:pointer}

<script>
"use strict";
/* ---------- constants ---------- */
const WTYPES=["주일예배","신년 주일","사순절","종려주일","고난주간","부활절","어린이주일","어버이주일","교사주일","맥추감사주일","좋은만남의축제","추수감사주일","대림절","성탄절","송구영신예배","동계수련회","하계수련회","특별새벽기도","금요기도회","직접쓰기"];
const POSITIONS=["인도자","싱어","드럼","베이스","일렉","어쿠스틱","메인건반","세컨건반","PPT","음향"];
const TIERS=["정규","수습","임시","게스트"];
const LABELS=["Intro","A","B","C","D","Verse","Chorus","Bridge","Interlude","Outro"];
const VCOL=["#ffe45c","#7fd3ff","#ff9fc9","#a8ee8c","#ffb86b","#c9a8ff"];
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const JSPDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const PDFJS_URL="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
const PDFJS_WORKER="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
const HEIC_URL="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js";
const TEAMS=[{id:"worship",name:"중앙성서워십",en:"CENTRAL BIBLE WORSHIP",color:"#2f62d6"},{id:"shema",name:"쉐마",en:"SHEMA",color:"#0f8a84"},{id:"gideon",name:"기드온",en:"GIDEON MINISTRY",color:"#b07d1f"},{id:"kairos",name:"카이로스",en:"KAIROS",color:"#6a4fd1"}];
const TEAM_KEY="cbwp-team";
const CHURCH_YT="https://www.youtube.com/@중앙성서교회";
const CHUNK=190000;
const draftKey=()=>"cbwp-draft-"+(S.team||"none");
const teamOf=d=>d.team||"gideon";
const teamName=id=>(TEAMS.find(t=>t.id===id)||{}).name||"";
const SECTIONS=[["opening","여는 찬양","고정된 시작 찬양 · 없으면 비워 두세요"],["before","예배 찬양","예배 시작 ~ 설교 전"],["after","설교 후 찬양",""]];
const allItems=c=>[...(c.opening||[]),...(c.before||[]),...(c.after||[])];
/* hymn titles look like "제목 (찬송가 79장)" or "제목 (찬송가 79장, 팀이름 편곡)" */
const HYMN_RE=/\s*\(찬송가\s*(\d{1,3})장(?:\s*,\s*([^)]*?)\s*편곡)?\)\s*$/;
function splitTitle(t){const m=(t||"").match(HYMN_RE);return m?{base:t.slice(0,m.index).trim(),hymn:+m[1],arr:m[2]||""}:{base:(t||"").trim(),hymn:null,arr:""};}
function joinTitle(base,hymn,arr){base=(base||"").trim();if(!hymn)return base;return `${base} (찬송가 ${hymn}장${arr?`, ${arr} 편곡`:""})`;}

/* ---------- state ---------- */
const S={db:null,user:null,downloads:null,myId:null,isOwner:false,canWrite:true,ready:false,dbFailed:false,team:null,teamCfgs:{},
  allMembers:[],allContis:[],members:[],songs:[],contis:[],catalogs:[],tab:"write",cur:null,curId:null,dirty:false,names:{}};
try{const t=localStorage.getItem(TEAM_KEY);if(TEAMS.some(x=>x.id===t))S.team=t;}catch(e){}
function applyTeam(){S.contis=S.allContis.filter(c=>teamOf(c)===S.team);S.members=S.allMembers.filter(mb=>teamOf(mb)===S.team);}
const imgCache=new Map(), imgInflight=new Map();

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const el=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;
    if(k==="class")el.className=v;else if(k==="style")el.style.cssText=v;else if(k==="text")el.textContent=v;
    else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);
    else if(k==="htmlFor")el.htmlFor=v;
    else if(["value","checked","disabled","type","placeholder","min","max","id","title","href","target","rel","accept","multiple","selected","name"].includes(k))el[k]=v;
    else el.setAttribute(k,v===true?"":v);}
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c instanceof Node?c:document.createTextNode(String(c)));}
  return el;}
const uid=(n=10)=>{const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;};
const clone=o=>JSON.parse(JSON.stringify(o));
function toast(msg,ms=2600){const t=h("div",{class:"toast",role:"status",text:msg});document.body.append(t);setTimeout(()=>t.remove(),ms);}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)&&loadScript.done[src])return res();
  const s=document.createElement("script");s.src=src;s.onload=()=>{loadScript.done[src]=1;res();};s.onerror=()=>rej(new Error("load"));document.head.append(s);});}
loadScript.done={};
const pad=n=>String(n).padStart(2,"0");
function todayStr(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function nextSunday(){const d=new Date();d.setDate(d.getDate()+((7-d.getDay())%7));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function parseD(s){const[y,m,d]=(s||"").split("-").map(Number);return y?new Date(y,m-1,d):null;}
function fmtDate(s){const d=parseD(s);if(!d)return "날짜 미정";return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()} (${"주일,월,화,수,목,금,토".split(",")[d.getDay()]})`;}
/* guess the worship from the date (church calendar); always editable */
function easterOf(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),hh=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-hh-k)%7,m=Math.floor((a+11*hh+22*l)/451);
  const mo=Math.floor((hh+l-7*m+114)/31),da=((hh+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function guessWtype(ds){const d=parseD(ds);if(!d)return{wtype:"주일예배",custom:""};const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate(),wd=d.getDay();
  const diff=Math.round((d-easterOf(y))/864e5);const nth=Math.ceil(day/7);
  if(m===12&&day===31)return{wtype:"송구영신예배",custom:""};
  if(m===12&&day===25)return{wtype:"성탄절",custom:""};
  if(diff>=-6&&diff<=-1)return{wtype:"고난주간",custom:""};
  if(wd===5)return{wtype:"금요기도회",custom:""};
  if(wd!==0)return{wtype:"직접쓰기",custom:["주일","월요","화요","수요","목요","금요","토요"][wd]+"예배"};
  if(diff===0)return{wtype:"부활절",custom:""};
  if(diff===-7)return{wtype:"종려주일",custom:""};
  if(diff>-47&&diff<-7)return{wtype:"사순절",custom:""};
  if(m===1&&nth===1)return{wtype:"신년 주일",custom:""};
  if(m===5&&nth===1)return{wtype:"어린이주일",custom:""};
  if(m===5&&nth===2)return{wtype:"어버이주일",custom:""};
  if(m===7&&nth===1)return{wtype:"맥추감사주일",custom:""};
  if(m===11&&nth===3)return{wtype:"추수감사주일",custom:""};
  const xmas=new Date(y,11,25),adv=Math.round((xmas-d)/864e5);if(adv>0&&adv<=28)return{wtype:"대림절",custom:""};
  return{wtype:"주일예배",custom:""};}
const wtypeOf=c=>c.wtype==="직접쓰기"?(c.wtypeCustom||"직접쓰기"):(c.wtype||"");
const leaderOf=c=>((c.roster||[]).find(r=>r.pos==="인도자")?.people||[]).map(p=>p.name).join(", ");

/* korean search */
const choOf=ch=>{const c=ch.charCodeAt(0);return c>=0xAC00&&c<=0xD7A3?CHO[Math.floor((c-0xAC00)/588)]:ch;};
const choStr=s=>[...(s||"")].map(choOf).join("");
const norm=s=>(s||"").toLowerCase().replace(/\s+/g,"");
const isCons=ch=>CHO.includes(ch);
function matchRank(title,q){const t=norm(title),qq=norm(q);if(!qq)return -1;const i=t.indexOf(qq);if(i===0)return 0;if(i>0)return 1;
  const tc=[...t],qc=[...qq];
  for(let s=0;s+qc.length<=tc.length;s++){let ok=true;for(let j=0;j<qc.length;j++){const a=qc[j],b=tc[s+j];if(a===b)continue;if(isCons(a)&&choOf(b)===a)continue;ok=false;break;}if(ok)return s===0?2:3;}
  return -1;}
function ytId(s){const m=(s||"").match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^#\s]*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);return m?m[1]:null;}
const ytUrl=id=>`https://www.youtube.com/watch?v=${id}`;
function cleanTitle(s){s=(s||"").replace(/https?:\/\/\S+/g," ");s=s.replace(/\[[^\]]*\]|【[^】]*】|\([^)]*\)|（[^）]*）/g," ");s=s.split(/[|｜]/)[0];s=s.replace(/\b(official|live|mv|m\/v|lyrics?|가사|라이브|공식)\b/gi," ");return s.replace(/\s+/g," ").replace(/^[\s\-–·:]+|[\s\-–·:]+$/g,"").trim();}

/* ---------- draft ---------- */
function blankConti(){const d=nextSunday(),g=guessWtype(d);return{date:d,wtype:g.wtype,wtypeCustom:g.custom,passage:"",sermonTitle:"",preacher:"",playlist:"",
  roster:POSITIONS.map(p=>({pos:p,people:[]})),opening:fixedOpening(),before:[],after:[],memo:"",status:"draft",team:S.team};}
const teamCfg=()=>S.teamCfgs[S.team]||{};
const fixedOpening=()=>(teamCfg().fixedOpening||[]).map(it=>({...clone(it),uid:uid(8)}));
async function setFixedOpening(items){if(!S.db||!S.team)return;try{await S.db.doc(`teams/${S.team}`).set({...teamCfg(),fixedOpening:clone(items).map(it=>({...it,memo:""})),updatedAt:Date.now()});}catch(e){toast("저장하지 못했어요");}}
function fixConti(c){for(const[k]of SECTIONS)c[k]=c[k]||[];return c;}
function saveDraft(){if(!S.team)return;try{localStorage.setItem(draftKey(),JSON.stringify({curId:S.curId,cur:S.cur,dirty:S.dirty}));}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(draftKey())||"null");if(d&&d.cur){S.cur=fixConti(d.cur);S.curId=d.curId||null;S.dirty=!!d.dirty;return true;}}catch(e){}return false;}
let draftT;function markDirty(){S.dirty=true;clearTimeout(draftT);draftT=setTimeout(saveDraft,400);clearTimeout(histT);const ev=window.event;if(ev&&ev.type==="input")histT=setTimeout(snapHist,700);else snapHist();updateStatus();}
/* undo history for the write tab: snapshots of the conti being written */
let histT;const H={owner:null,list:[],last:null};
function initHist(){if(H.owner!==S.cur){H.owner=S.cur;H.list=[];H.last=JSON.stringify(S.cur);}}
function snapHist(){if(H.owner!==S.cur)return initHist();const j=JSON.stringify(S.cur);if(j!==H.last){H.list.push(H.last);if(H.list.length>60)H.list.shift();H.last=j;}updUndo();}
function updUndo(){const b=$("#undoBtn");if(b)b.disabled=!H.list.length&&JSON.stringify(S.cur)===H.last;}
function undoConti(){if(!curEditable())return;clearTimeout(histT);snapHist();if(!H.list.length)return toast("더 되돌릴 내용이 없어요");
  H.last=H.list.pop();S.cur=fixConti(JSON.parse(H.last));H.owner=S.cur;S.dirty=true;saveDraft();render();toast("한 단계 되돌렸어요");}
function resetConti(btn){if(!curEditable())return;if(!btn.dataset.armed){btn.dataset.armed="1";btn.textContent="정말 비울까요?";setTimeout(()=>{delete btn.dataset.armed;btn.textContent="초기화";},3000);return;}
  clearTimeout(histT);snapHist();const b=blankConti();b.date=S.cur.date||b.date;const g=guessWtype(b.date);b.wtype=g.wtype;b.wtypeCustom=g.custom;b.team=S.cur.team||S.team;
  S.cur=b;H.owner=b;H.list.push(H.last);H.last=JSON.stringify(b);S.dirty=true;saveDraft();render();toast("내용을 비웠어요. 「실행 취소」로 되돌릴 수 있어요",3200);}

/* ---------- permissions ---------- */
function canEditConti(c,id){if(!id)return S.canWrite;if(S.isOwner)return true;return !!(c&&c.authorId&&c.authorId===S.myId);}
const curEditable=()=>S.canWrite&&canEditConti(S.cur,S.curId);

/* ---------- names (authors) ---------- */
async function resolveNames(ids){ids=[...new Set(ids.filter(Boolean))];if(!ids.length||!S.user)return;
  try{const ps=await S.user.profiles(ids);for(const id of ids)S.names[id]=ps[id]?.name||"";}catch(e){}
  document.querySelectorAll("[data-author]").forEach(el=>{const id=el.dataset.author;el.textContent=(id===S.myId?"나":S.names[id])||"팀원";});}
const authorEl=id=>h("span",{"data-author":id||"",text:id?(id===S.myId?"나":S.names[id]||"팀원"):"알 수 없음"});

/* ---------- images in shared store ---------- */
async function storeImage(im){const id=uid(12);imgCache.set(id,im.url);
  if(!S.db)return id;
  const n=Math.ceil(im.url.length/CHUNK);
  for(let i=0;i<n;i++)await S.db.doc(`imgChunks/${id}.${i}`).set({d:im.url.slice(i*CHUNK,(i+1)*CHUNK)});
  await S.db.doc(`imgs/${id}`).set({n,w:im.w,h:im.h,by:S.myId||null,at:Date.now()});
  return id;}
function getImg(id){if(imgCache.has(id))return Promise.resolve(imgCache.get(id));if(imgInflight.has(id))return imgInflight.get(id);
  const p=(async()=>{if(!S.db)return null;const meta=await S.db.doc(`imgs/${id}`).get();if(!meta.exists)return null;const n=meta.data().n;
    const parts=await Promise.all(Array.from({length:n},(_,i)=>S.db.doc(`imgChunks/${id}.${i}`).get()));
    const url=parts.map(p=>p.exists?p.data().d:"").join("");imgCache.set(id,url);return url;})()
    .catch(()=>null).finally(()=>imgInflight.delete(id));
  imgInflight.set(id,p);return p;}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});}
function toJpeg(src,w,h){const max=1700,s=Math.min(1,max/w);const cw=Math.round(w*s),ch=Math.round(h*s);
  const c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
  let q=.85,url=c.toDataURL("image/jpeg",q);while(url.length>900000&&q>.5){q-=.1;url=c.toDataURL("image/jpeg",q);}return{url,w:cw,h:ch};}
async function fileToImages(file){const name=(file.name||"").toLowerCase(),type=file.type||"";
  if(type==="application/pdf"||name.endsWith(".pdf")){
    await loadScript(PDFJS_URL);await loadScript(PDFJS_WORKER);
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;
    const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];

async function exportCompact(c){if(!c)return;

  const md=modal("압축버전 만드는 중",h("div",{class:"panel-body"},h("p",{id:"pdf-st",text:"악보를 모으고 있어요…"})),null);const st=$("#pdf-st",md.el);

    const imgs=[];for(const s of items){st.textContent=`악보 불러오는 중… (${imgs.length+1}/${items.length})`;const u=await getImg(s.p.imgId);imgs.push(u?await loadImg(u):null);}

      for(let cols=1;cols<=items.length;cols++){const rows=Math.ceil(items.length/cols);const cw=(aw-GAP*(cols-1))/cols,ch=(ah-GAP*(rows-1))/rows-CAP;if(ch<=20)continue;

    st.textContent="PDF로 묶는 중…";
    const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a3",orientation:land?"landscape":"portrait",compress:true});
